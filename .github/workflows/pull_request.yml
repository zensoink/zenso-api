name: Pull Request

on:
  pull_request:
    branches: [master, develop, next]

env:
  NODE_VERSION: 24
  RETENTION_DAYS: 30

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      cache-key: ${{ steps.cache-key.outputs.cache-key }}
    steps:
      - uses: actions/checkout@v6
      - name: Enable Corepack
        run: corepack enable
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - id: cache-key
        run: |
          SCHEMA_HASH=$(sha256sum prisma/schema.prisma | cut -d' ' -f1)
          CACHE_KEY="${{ runner.os }}-node-${{ env.NODE_VERSION }}-pnpm-cache-$(sha256sum pnpm-lock.yaml | cut -d' ' -f1)-schema-$SCHEMA_HASH"
          echo "cache-key=$CACHE_KEY" >> $GITHUB_OUTPUT
      - uses: actions/cache@v4
        id: pnpm-cache
        with:
          path: |
            node_modules
            ~/.pnpm-store
          key: ${{ steps.cache-key.outputs.cache-key }}
          restore-keys: |
            ${{ runner.os }}-node-${{ env.NODE_VERSION }}-pnpm-cache-
      - run: pnpm install --frozen-lockfile
      - run: pnpm run db:generate

  lint:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Enable Corepack
        run: corepack enable
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.pnpm-store
          key: ${{ needs.setup.outputs.cache-key }}
      - run: pnpm run lint
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: lint-report/
          retention-days: ${{ env.RETENTION_DAYS }}

  test:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Enable Corepack
        run: corepack enable
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.pnpm-store
          key: ${{ needs.setup.outputs.cache-key }}
      - run: pnpm run test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report
          path: test-report/
          retention-days: ${{ env.RETENTION_DAYS }}

  build:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Enable Corepack
        run: corepack enable
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.pnpm-store
          key: ${{ needs.setup.outputs.cache-key }}
      - run: pnpm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-report
          path: build-report/
          retention-days: ${{ env.RETENTION_DAYS }}
